# Cold-email job agent settings. See PROJECT.md for the full design.

resume:
  # Export Arjun_Khanna_CV_V4.docx to PDF once and drop it here (data/ is gitignored).
  pdf_path: "./data/resume.pdf"
  attach_by_default: true

sender:
  email: ""              # personal Gmail address — fill in before module 7 (sending)
  display_name: "Arjun Khanna"

gmail:
  # OAuth client JSON from Google Cloud Console (APIs & Services -> Credentials ->
  # Create Credentials -> OAuth client ID -> Desktop app). Never commit either file —
  # both live under data/, which is gitignored.
  credentials_path: "./data/gmail_credentials.json"
  # Written by scripts/gmail_auth.py after the one-time OAuth consent flow.
  token_path: "./data/gmail_token.json"

sourcing:
  sources:
    - yc
    - producthunt
    - startup_india
    - manual_csv

contact_discovery:
  # Search order: HR/Talent/Recruiting tried first (higher reply rate), Product roles second.
  # This is a preference, not a hard filter — either outcome is accepted.
  role_search_order:
    - hr
    - product
  finder_api: hunter        # hunter | apollo | prospeo | snov — swappable, see agent/EmailFinder interface (module 4)
  min_verification_confidence: 0.7

niches:
  order:                    # tie-break order when a company scores equally across niches
    - consumer
    - fintech
    - data_saas
    - ai_devtools
  # Contact discovery (Hunter.io lookups) only runs for companies whose classified
  # niche is in this list — conserves free-tier quota and scraping effort while
  # Arjun's focus is consumer/marketplace firms. Company sourcing + classification
  # still run against all niches so nothing is lost, it's just not looked up yet.
  # Add fintech/data_saas/ai_devtools back here when ready to expand.
  active_for_discovery:
    - consumer

send:
  start_daily_cap: 10
  ramp_step: 2
  ramp_ceiling: 25
  ramp_interval_days: 7
  bounce_rate_circuit_breaker: 0.05   # halt sending and flag for review above this bounce rate
  # Randomized pause between individual sends within one run, so a batch doesn't
  # fire as one instant burst. This spaces a run over minutes, not hours — true
  # all-day spacing would mean multiple smaller Task Scheduler triggers instead
  # of one long-blocking script.
  min_delay_seconds: 30
  max_delay_seconds: 120

followup:
  business_days_wait: 5
  max_followups: 1

paths:
  db_path: "./agent.db"
  story_bank_path: "./config/story_bank.yaml"
  templates_dir: "./config/templates"
  niche_keywords_path: "./config/niche_keywords.yaml"

linkedin_jobs:
  # Standalone job-search tool (separate from the cold-email pipeline above) — see
  # PROJECT.md's "LinkedIn Job Lookup" section. Searches LinkedIn's public, logged-out
  # jobs search page via an Apify Actor, so Arjun's own LinkedIn account/session is
  # never used. Output is an Excel file only; nothing here touches agent.db.
  keywords:
    - "Product Manager"
    - "Associate Product Manager"
    - "APM"
    - "Product Lead"
    - "Growth Product Manager"
  location: "India"
  date_posted: pastWeek     # anyTime | past24Hours | pastWeek | pastMonth
  # Combined cap across ALL keywords above (not per-keyword) — keeps Apify spend
  # predictable regardless of how many keywords are configured.
  limit: 100
  output_dir: "./data"

linkedin_posts:
  # Second, noisier data source alongside linkedin_jobs above: LinkedIn posts where
  # someone personally announces a hiring need (a PM or HR person posting "we're
  # hiring a PM..."), which the Jobs-tab search above never sees. Reuses
  # linkedin_jobs.keywords for query text and relevance filtering — no separate
  # keyword list to keep in sync. Query locations are a separate, broader hardcoded
  # list in agent/linkedin_posts.py (DEFAULT_QUERY_LOCATIONS) since this search has
  # no true geo filter — see PROJECT.md §8.1 for why (real posts named cities, not
  # "India") and for the client-side relevance filter (hiring-intent phrase +
  # author headline role-signal) layered on top of the Actor's loose text matching.
  posted_limit: month   # any | 1h | 24h | week | month | 3months | 6months | year
  # Combined RAW-fetch cap across all queries (this is what drives Apify spend —
  # the relevance filter runs after fetching, so the final sheet will have fewer
  # rows than this). Raised from 50 -> 100 (2026-08-23) alongside the broader query
  # set above, to give the wider net more room to actually surface matches.
  limit: 100
