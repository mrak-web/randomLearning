# Keyword lists for the rule-based niche classifier (agent/classification.py, PROJECT.md §4.2).
#
# Matching is case-insensitive and whole-word (regex \b...\b) against each company's
# name + raw_tags (joined into one string). A niche's score is how many of its keywords
# hit; highest score wins; ties break toward the order in settings.yaml niches.order
# (consumer first). A company with zero hits across all niches is left unclassified
# (status=skipped) for manual tagging rather than guessed.
#
# Edit freely — these are a starting point, not tuned against real data yet.

